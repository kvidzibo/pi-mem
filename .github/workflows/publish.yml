name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Package version must be stable: <major>.<minor>.<patch>');
          }
          NODE
      - name: Install UI test wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: dbus-run-session -- npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish if version is new
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # Fail on registry errors rather than treating them as an unpublished version.
          VERSIONS=$(npm view "$NAME" versions --json)
          PUBLISHED=$(VERSIONS="$VERSIONS" VERSION="$VERSION" node --input-type=module <<'NODE'
          const versions = JSON.parse(process.env.VERSIONS);
          if (!Array.isArray(versions) || !versions.every(version => typeof version === 'string')) {
            throw new Error('Unexpected npm versions response');
          }
          console.log(versions.includes(process.env.VERSION));
          NODE
          )
          if [ "$PUBLISHED" = true ]; then
            echo "Skip: $NAME@$VERSION already on npm"
          else
            npm publish --ignore-scripts --access public --provenance
          fi
